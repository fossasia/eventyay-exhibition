name: Code Style

on:
  push:
    branches: [main, master, dev]
    paths-ignore:
      - "exhibition/locale/**"
      - "exhibition/static/**"
  pull_request:
    branches: [main, master, dev]
    paths-ignore:
      - "exhibition/locale/**"
      - "exhibition/static/**"

concurrency:
  group: style-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --group dev

      - name: Run ruff (lint, including import sorting)
        run: uv run ruff check .

      - name: Run ruff (format check)
        run: uv run ruff format --check .
