[project]
name = "exhibition"
dynamic = ["version"]
description = "Eventyay-tickets plugin to add and manage exhibitors"
readme = "README.rst"
requires-python = ">=3.12, <3.13"
license = {file = "LICENSE"}
keywords = ["Eventyay"]
authors = [
    {name = "eventyay team", email = "support@eventyay.com"},
]
maintainers = [
    {name = "eventyay team", email = "support@eventyay.com"},
]

dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "pytest-env>=1.6.0",
    "pytest-rerunfailures>=16.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]

[project.entry-points."pretix.plugin"]
exhibition = "exhibition:PretixPluginMeta"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[project.urls]
homepage = "https://github.com/fossasia/eventyay-exhibition"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "exhibition.__version__"}

[tool.setuptools.packages.find]
include = ["exhibition*"]
namespaces = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations", "static", "_static", "build", ".ropeproject"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PLE", "PLW", "UP"]
ignore = ["E203", "E402", "E722", "E741"]

[tool.ruff.lint.per-file-ignores]
# These files re-export models.
"**/__init__.py" = ["F401"]
"setup.py" = ["I"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["exhibition"]
known-third-party = ["eventyay"]
