[project]
name = "exhibition"
dynamic = ["version"]
description = "Eventyay-tickets plugin to add and manage exhibitors"
readme = "README.rst"
requires-python = ">=3.12, <3.13"
license = {file = "LICENSE"}
keywords = ["Eventyay"]
authors = [
    {name = "eventyay team", email = "support@eventyay.com"},
]
maintainers = [
    {name = "eventyay team", email = "support@eventyay.com"},
]

dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-env>=1.7.0",
    "pytest-rerunfailures>=16.6",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[project.entry-points."pretix.plugin"]
exhibition = "exhibition:PretixPluginMeta"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[project.urls]
homepage = "https://github.com/fossasia/eventyay-exhibition"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "exhibition.__version__"}

[tool.setuptools.packages.find]
include = ["exhibition*"]
namespaces = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations", "static", "_static", "build", ".ropeproject"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PLE", "PLW", "UP"]
ignore = ["E203", "E402", "E722", "E741"]

[tool.ruff.lint.per-file-ignores]
# These files re-export models.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["exhibition"]
known-third-party = ["eventyay"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "eventyay.config.settings"
testpaths = ["tests"]

[tool.pytest_env]
EVY_RUNNING_ENVIRONMENT = "testing"
EVY_POSTGRES_HOST = "localhost"
EVY_POSTGRES_PORT = "5432"
EVY_POSTGRES_USER = "postgres"
EVY_POSTGRES_PASSWORD = "postgres"
EVY_POSTGRES_DB = "eventyay-db"

[tool.coverage.run]
source = ["exhibition"]
omit = ["*/migrations/*", "*/urls.py", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __str__",
    "def __repr__",
    "if settings.DEBUG",
    "NOQA",
    "NotImplementedError",
]

[tool.check-manifest]
ignore = [
    ".update-locales",
    ".update-locales.sh",
    "Makefile",
    "manage.py",
    "tests/*",
]
